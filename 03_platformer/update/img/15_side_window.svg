<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">世界を動かさず、カメラの見る範囲を上げる</text><rect x="45" y="85" width="310" height="300" fill="#e4effa" /><rect x="60" y="350" width="80" height="20" fill="#6288a8" /><rect x="155" y="275" width="80" height="20" fill="#6288a8" /><rect x="245" y="200" width="80" height="20" fill="#6288a8" /><rect x="440" y="85" width="310" height="300" fill="#e4effa" /><rect x="455" y="350" width="80" height="20" fill="#6288a8" /><rect x="550" y="275" width="80" height="20" fill="#6288a8" /><rect x="640" y="200" width="80" height="20" fill="#6288a8" /><rect x="55" y="220" width="290" height="150" fill="none" stroke="#2384b5" stroke-width="3"/><rect x="450" y="125" width="290" height="150" fill="none" stroke="#2384b5" stroke-width="3"/><rect x="170" y="240" width="25" height="35" fill="#db633b" /><rect x="650" y="165" width="25" height="35" fill="#db633b" /><text x="365" y="230" font-size="30">→</text><text x="45" y="422" font-size="22">低い場所を見る</text><text x="440" y="422" font-size="22">上ったプレイヤーを追う</text><text x="40" y="475" font-size="19">青い枠がカメラ。足場の世界座標は変えません。</text></g></svg>