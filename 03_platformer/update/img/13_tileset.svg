<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390"><rect width="100%" height="100%" fill="white"/><style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16324f} .title{font-size:28px;font-weight:700} .label{font-size:22px} .small{font-size:18px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2384b5"/></marker></defs><text x="40" y="50" class="title">元画像を32×32ずつ切り取る</text><text x="40" y="90" class="label">画像全体：横96 × 縦32ピクセル</text><text x="70" y="145" class="small">x = 0</text><text x="290" y="145" class="small">32</text><text x="510" y="145" class="small">64</text><text x="720" y="145" class="small">96</text><rect x="70" y="160" width="220" height="100" fill="#e4effa" stroke="#2384b5" stroke-width="2"/><rect x="290" y="160" width="220" height="100" fill="#e4f6ed" stroke="#26835c" stroke-width="2"/><rect x="510" y="160" width="220" height="100" fill="#f2f4f7" stroke="#91a2b2" stroke-width="2"/><text x="180" y="202" text-anchor="middle" class="label">壁に使う</text><text x="180" y="236" text-anchor="middle" class="small">左上 (0, 0)</text><text x="400" y="202" text-anchor="middle" class="label">床に使う</text><text x="400" y="236" text-anchor="middle" class="small">左上 (32, 0)</text><text x="620" y="217" text-anchor="middle" class="label">今回は未使用</text><text x="40" y="312" class="label">切り取り：32×32 → ゲーム内の表示：64×64</text><text x="40" y="352" class="small">元画像のサイズは変えず、表示するときだけ2倍に拡大します。</text></svg>