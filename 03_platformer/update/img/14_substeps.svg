<svg xmlns="http://www.w3.org/2000/svg" width="800" height="585" viewBox="0 0 800 585"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">大きな移動は、小分けにして途中も調べる</text><text x="35" y="90" font-size="21">一度に動く：手前と移動先だけでは壁を見逃す</text><rect x="40" y="120" width="75" height="65" fill="#b7e8cc" /><rect x="335" y="105" width="65" height="100" fill="#6288a8" /><rect x="660" y="120" width="75" height="65" fill="#b7e8cc" /><path d="M125 153 L650 153" fill="none" stroke="#2384b5" stroke-width="2" /><text x="45" y="230" font-size="18">移動前</text><text x="665" y="230" font-size="18">移動後</text><text x="35" y="295" font-size="21">小分けに動く：途中で重なったら、壁の手前で止める</text><rect x="335" y="320" width="65" height="100" fill="#6288a8" /><rect x="40" y="335" width="75" height="65" fill="#b7e8cc" fill-opacity="0.45" stroke="#26835c"/><rect x="100" y="335" width="75" height="65" fill="#b7e8cc" fill-opacity="0.45" stroke="#26835c"/><rect x="160" y="335" width="75" height="65" fill="#b7e8cc" fill-opacity="0.45" stroke="#26835c"/><rect x="220" y="335" width="75" height="65" fill="#b7e8cc" fill-opacity="0.45" stroke="#26835c"/><rect x="280" y="335" width="75" height="65" fill="#b7e8cc" fill-opacity="0.45" stroke="#26835c"/><text x="430" y="370" font-size="21">途中で判定！</text><text x="35" y="465" font-size="21">例：今回の移動が横20・縦0なら、3回に分ける</text><text x="35" y="505" font-size="22">ceil(20 ÷ 8) = 3回　→　1回あたり約6.67</text><text x="35" y="548" font-size="18">ceil() は切り上げ。各方向の移動を8以下にして調べます。</text></g></svg>