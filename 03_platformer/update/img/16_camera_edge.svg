<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">端ではカメラを止め、プレイヤーだけが進む</text><text x="40" y="85" font-size="21">途中：カメラが追う</text><rect x="40" y="100" width="720" height="120" fill="#e4effa" /><rect x="220" y="110" width="340" height="100" fill="none" stroke="#2384b5" stroke-width="3"/><rect x="295" y="155" width="24" height="45" fill="#db633b" /><text x="40" y="285" font-size="21">右端：カメラは止まる</text><rect x="40" y="300" width="720" height="120" fill="#e4effa" /><rect x="420" y="310" width="340" height="100" fill="none" stroke="#2384b5" stroke-width="3"/><rect x="690" y="355" width="24" height="45" fill="#db633b" /><text x="40" y="470" font-size="19">青枠＝画面の範囲。マップの外へ出る前に止めます。</text><text x="40" y="510" font-size="19">左右だけでなく、上端・下端でも同じ考え方です。</text></g></svg>