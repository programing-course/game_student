<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, sans-serif"><text x="35" y="48" font-size="27">床を離れたら、次の更新で落ちる</text><rect x="65" y="180" width="190" height="45" rx="6" fill="#6288a8"/><rect x="125" y="95" width="65" height="85" rx="6" fill="#b7e8cc"/><rect x="460" y="180" width="150" height="45" rx="6" fill="#6288a8"/><rect x="640" y="95" width="65" height="85" rx="6" fill="#b7e8cc"/><text x="320" y="170" font-size="22">→</text><text x="70" y="270" font-size="20">足元のすぐ下に1がある</text><text x="465" y="270" font-size="20">足元の下が0になる</text><text x="70" y="315" font-size="22">接地：true</text><text x="465" y="315" font-size="22">接地：false</text><text x="35" y="380" font-size="22">毎回、重力と足元の確認をやり直す。</text><text x="35" y="425" font-size="18">以前の固定の地面判定は、ダンジョンでは使いません。</text></g></svg>