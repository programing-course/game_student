<svg xmlns="http://www.w3.org/2000/svg" width="800" height="535" viewBox="0 0 800 535"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="26">狭いマップでは左右に動かず、左端をそろえる</text><rect x="50" y="95" width="700" height="175" fill="#e4effa" /><rect x="50" y="95" width="420" height="175" fill="#b7e8cc" /><text x="85" y="150" font-size="22">マップ：幅640</text><text x="510" y="205" font-size="20">暗い余白</text><text x="70" y="305" font-size="22">画面：幅1000（マップより広い）</text><text x="40" y="365" font-size="22">cameraX = 画面幅 × anchor.x</text><text x="40" y="408" font-size="22">例：1000 × 0.3 = 300</text><text x="40" y="457" font-size="19">画面左端の世界x = 300 − 1000 × 0.3 = 0</text><text x="40" y="502" font-size="18">広いマップだけ、左右端を越えない範囲で追従します。</text></g></svg>