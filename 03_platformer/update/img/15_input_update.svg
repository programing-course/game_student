<svg xmlns="http://www.w3.org/2000/svg" width="800" height="555" viewBox="0 0 800 555"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">キー入力は「速度」、毎回の更新は「位置」を変える</text><rect x="40" y="90" width="720" height="90" rx="12" fill="#e4effa"/><text x="60" y="125" class="">① キーを押す・離す</text><text x="60" y="160" class="small">keysPressed から、今押されている方向を調べる</text><text x="385" y="206" class="">↓</text><rect x="40" y="215" width="720" height="90" rx="12" fill="#e4effa"/><text x="60" y="250" class="">② velocity を決める</text><text x="60" y="285" class="small">右なら (200, 0)、方向キーがなければ (0, 0)</text><text x="385" y="331" class="">↓</text><rect x="40" y="340" width="720" height="90" rx="12" fill="#e4effa"/><text x="60" y="375" class="">③ update(dt) で位置を進める</text><text x="60" y="410" class="small">position += velocity × dt</text><text x="40" y="483" class="small">例：右へ200の速度 × 0.02秒 = 右へ4だけ進む</text><text x="40" y="524" class="small">離したときも方向を調べ直すので、押し続けた状態が残らない。</text></svg>