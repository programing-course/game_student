<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">ステージ番号で、配置と背景を切り替える</text><rect x="40" y="90" width="340" height="175" rx="12" fill="#c4f0e8"/><text x="60" y="129" class="">currentStage = 0</text><text x="60" y="174" class="">ステージ1：case 0</text><text x="60" y="220" class="">ここに入口の扉を置く</text><rect x="420" y="90" width="340" height="175" rx="12" fill="#e4effa"/><text x="440" y="129" class="">currentStage = 2</text><text x="440" y="174" class="">ダンジョン：case 2</text><text x="440" y="220" class="">背景を暗い色にする</text><text x="387" y="185" class="">→</text><text x="40" y="318" class="small">「ステージ1」の内部番号は0。ダンジョンの内部番号は2。</text><text x="40" y="360" class="small">第11回では、暗い背景へ移るところまで作ります。</text><text x="40" y="402" class="small">迷路の配列・画像・プレイヤー配置は、第12回以降です。</text></svg>