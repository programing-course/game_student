<svg xmlns="http://www.w3.org/2000/svg" width="800" height="535" viewBox="0 0 800 535"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="26">clamp：プレイヤー全体をマップの中に収める</text><rect x="80" y="120" width="640" height="170" fill="#e4effa" /><path d="M80 100 L80 320" fill="none" stroke="#2384b5" stroke-width="2" /><path d="M720 100 L720 320" fill="none" stroke="#2384b5" stroke-width="2" /><rect x="80" y="165" width="60" height="80" fill="#b7e8cc" /><rect x="660" y="165" width="60" height="80" fill="#b7e8cc" /><circle cx="110" cy="205" r="5" fill="#db633b"/><circle cx="690" cy="205" r="5" fill="#db633b"/><text x="68" y="350" font-size="21">0</text><text x="675" y="350" font-size="21">640</text><text x="40" y="95" font-size="18">例：マップ幅640、プレイヤー幅60</text><text x="95" y="280" font-size="18">中心30</text><text x="630" y="280" font-size="18">中心610</text><text x="40" y="405" font-size="26">中心xの範囲：30 ～ 610</text><text x="40" y="451" font-size="19">左端の限界 = 幅÷2　　右端の限界 = マップ幅 − 幅÷2</text><text x="40" y="495" font-size="20">x = −10 → 30へ戻す　／　x = 650 → 610へ戻す</text></g></svg>