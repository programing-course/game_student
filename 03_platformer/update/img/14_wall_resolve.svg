<svg xmlns="http://www.w3.org/2000/svg" width="800" height="585" viewBox="0 0 800 585"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">横の壁：めり込んだ位置を、壁の手前へ戻す</text><text x="40" y="90" font-size="21">① 右へ動くと重なる</text><text x="440" y="90" font-size="21">② 右端を壁の左端にそろえる</text><rect x="230" y="125" width="90" height="180" fill="#6288a8" /><rect x="150" y="165" width="120" height="120" fill="#b7e8cc" fill-opacity="0.85"/><rect x="230" y="165" width="40" height="120" fill="#f6b8a6" /><circle cx="210" cy="225" r="5" fill="#db633b"/><text x="140" y="330" font-size="17">色の重なった部分がめり込み</text><rect x="620" y="125" width="90" height="180" fill="#6288a8" /><rect x="500" y="165" width="120" height="120" fill="#b7e8cc" /><circle cx="560" cy="225" r="5" fill="#db633b"/><path d="M620 110 L620 345" fill="none" stroke="#2384b5" stroke-width="2" /><text x="605" y="370" font-size="18">壁の左端</text><text x="480" y="330" font-size="17">中央から右端まで半幅</text><text x="365" y="220" font-size="32">→</text><text x="40" y="425" font-size="21">例：壁の左端200、プレイヤーの幅60</text><text x="40" y="468" font-size="25">新しい中心x = 200 − 60 ÷ 2 = 170</text><text x="40" y="512" font-size="18">中心170 + 半幅30 = 右端200。壁とぴったりそろう。</text><text x="40" y="552" font-size="18">位置だけを戻す。横の速度は残すので、壁を越えたら進める。</text></g></svg>