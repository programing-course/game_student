<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">触れる → 開く → ダンジョンへ移る</text><rect x="40" y="85" width="720" height="90" rx="12" fill="#e4effa"/><text x="60" y="120" class="">① プレイヤーが扉に触れる</text><text x="60" y="153" class="small">onCollisionStart()</text><text x="385" y="198" class="">↓</text><rect x="40" y="202" width="720" height="90" rx="12" fill="#e4effa"/><text x="60" y="237" class="">② 開いた画像に切り替える</text><text x="60" y="270" class="small">isOpening = true / sprite = openedSprite</text><text x="385" y="315" class="">↓</text><rect x="40" y="319" width="720" height="90" rx="12" fill="#e4effa"/><text x="60" y="354" class="">③ 0.4秒後に切り替えを呼ぶ</text><text x="60" y="387" class="small">TimerComponent → enterDungeon()</text><text x="385" y="432" class="">↓</text><rect x="40" y="436" width="720" height="90" rx="12" fill="#e4f6ed"/><text x="60" y="471" class="">④ ステージを2にして作り直す</text><text x="60" y="504" class="small">currentStage = 2 → case 2</text><text x="40" y="591" class="small">isOpening が true なら、触れても二重に開始しません。</text></svg>