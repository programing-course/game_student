<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><rect width="800" height="540" fill="white"/><style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16324f;font-size:22px}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">左上から「半マス」進むと中央になる</text><rect x="70" y="130" width="256" height="256" fill="#e4f6ed" stroke="#26835c" stroke-width="3"/><path d="M70 130 H198 V258" fill="none" stroke="#2384b5" stroke-width="3" stroke-dasharray="8 5"/><circle cx="70" cy="130" r="6" fill="#2384b5"/><circle cx="198" cy="258" r="7" fill="#de6741"/><text x="70" y="110">マスの左上 (96, 144)</text><text x="105" y="162" class="small">右へ32</text><text x="212" y="211" class="small">下へ32</text><text x="360" y="205">行1・列1の中央</text><text x="360" y="248" class="title">(128, 176)</text><text x="360" y="294">1マス：64×64</text><text x="360" y="334">半マス：64 ÷ 2 = 32</text><text x="40" y="440">x = 余白32 + 列1 × 64 + 32 = 128</text><text x="40" y="482">y = 余白80 + 行1 × 64 + 32 = 176</text><text x="40" y="520" class="small">行・列の番号は0から数えます。座標はゲーム世界の位置です。</text></svg>