<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">乗っていたら、足場と同じ移動量を足す</text><rect x="80" y="230" width="220" height="35" rx="10" fill="#6288a8"/><rect x="145" y="145" width="80" height="85" rx="10" fill="#b7e8cc"/><text x="168" y="196" class="">人</text><rect x="455" y="155" width="220" height="35" rx="10" fill="#6288a8"/><rect x="520" y="70" width="80" height="85" rx="10" fill="#b7e8cc"/><text x="543" y="121" class="">人</text><text x="85" y="310" class="">移動前</text><text x="460" y="235" class="">移動後</text><text x="310" y="180" class="">右へ4</text><text x="310" y="220" class="">上へ2</text><text x="40" y="365" class="">足場の移動量 = 移動後の位置 − 移動前の位置</text><text x="40" y="411" class="">プレイヤーにも (4, −2) を足す</text><text x="40" y="460" class="small">乗っているかは、足場を動かす前に判定します。</text><text x="40" y="497" class="small">横の重なり ＋ 足元が上面から4以内 ＋ 上昇中でない</text></svg>