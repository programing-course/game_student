<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">進み具合をXとYに共通で使う</text><rect x="35" y="110" width="220" height="115" rx="10" fill="#e4effa"/><text x="50" y="153" class="">0：開始</text><text x="50" y="197" class="">(100, 300)</text><rect x="290" y="110" width="220" height="115" rx="10" fill="#e4effa"/><text x="305" y="153" class="">0.5：中間</text><text x="305" y="197" class="">(175, 250)</text><rect x="545" y="110" width="220" height="115" rx="10" fill="#e4effa"/><text x="560" y="153" class="">1：終了</text><text x="560" y="197" class="">(250, 200)</text><text x="262" y="175" class="">→</text><text x="517" y="175" class="">→</text><text x="40" y="280" class="">位置 = 開始位置 + 移動量 × moveProgress</text><rect x="40" y="315" width="720" height="120" rx="10" fill="#e4f6ed"/><text x="65" y="355" class="">行き：0 → 0.5 → 1</text><text x="65" y="401" class="">帰り：1 → 0.5 → 0</text><text x="40" y="485" class="small">0.5なら、XもYも半分進むので同じ直線上に並びます。</text></svg>