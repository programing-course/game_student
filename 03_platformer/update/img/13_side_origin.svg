<svg xmlns="http://www.w3.org/2000/svg" width="800" height="505" viewBox="0 0 800 505"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, sans-serif"><text x="35" y="48" font-size="26">最下段のブロックの上面を、今の地面に合わせる</text><path d="M100 120 V330 H730" fill="none" stroke="#2384b5" stroke-width="3"/><rect x="100" y="330" width="630" height="45" fill="#6288a8"/><text x="125" y="120" font-size="22">マップの左上：y = 地面の高さ − 448</text><text x="125" y="213" font-size="22">行0から行7まで：7 × 64 = 448</text><text x="125" y="302" font-size="22">最下段・行7の上面：Y_GROUND_POSITION</text><text x="40" y="425" font-size="22">親の位置 + 子の位置 = ゲーム世界での位置</text><text x="40" y="469" font-size="20">(地面 − 448) + 7 × 64 = 地面の高さ</text></g></svg>