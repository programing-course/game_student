<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">縦の衝突：足元か頭をブロックにそろえる</text><text x="40" y="92" font-size="21">落下中：dy &gt; 0</text><text x="435" y="92" font-size="21">上昇中：dy &lt; 0</text><rect x="80" y="150" width="120" height="120" fill="#b7e8cc" /><rect x="45" y="270" width="300" height="55" fill="#6288a8" /><circle cx="140" cy="210" r="5" fill="#db633b"/><text x="220" y="210" font-size="18">中心y = 270</text><text x="210" y="255" font-size="18">足元y = 300</text><text x="45" y="355" font-size="18">ブロックの上面y = 300</text><rect x="430" y="150" width="310" height="55" fill="#6288a8" /><rect x="470" y="205" width="120" height="120" fill="#b7e8cc" /><circle cx="530" cy="265" r="5" fill="#db633b"/><text x="610" y="270" font-size="17">中心y = 230</text><text x="430" y="355" font-size="18">ブロックの下面y = 200</text><text x="35" y="413" font-size="23">中心 = 上面 − 半高さ</text><text x="430" y="413" font-size="23">中心 = 下面 + 半高さ</text><text x="35" y="451" font-size="21">300 − 30 = 270</text><text x="430" y="451" font-size="21">200 + 30 = 230</text><text x="35" y="501" font-size="21">着地後の縦速度 = 0</text><text x="430" y="501" font-size="20">上昇を止め、重力で落ちる</text><text x="35" y="547" font-size="17">図のプレイヤーの高さは60。位置の図は仕組みを示す模式図。</text></g></svg>