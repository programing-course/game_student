<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720"><rect width="100%" height="100%" fill="white"/><style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16324f} .title{font-size:28px;font-weight:700} .label{font-size:22px} .small{font-size:18px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2384b5"/></marker></defs><text x="40" y="52" class="title">マップの位置を足して、画面の位置にする</text><text x="40" y="90" class="small">カメラを左上 (0, 0) に固定している場合</text><rect x="60" y="125" width="640" height="95" rx="14" fill="#e4effa"/><text x="90" y="163" class="label">画面の左上</text><text x="90" y="199" class="title">(0, 0)</text><path d="M140 230 V285" stroke="#2384b5" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="264" class="label">右へ32・下へ80（マップの余白）</text><rect x="60" y="305" width="640" height="95" rx="14" fill="#e4f6ed"/><text x="90" y="343" class="label">マップの左上</text><text x="90" y="379" class="title">(32, 80)</text><path d="M140 410 V465" stroke="#2384b5" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="440" class="label">右へ128・下へ64</text><text x="180" y="470" class="small">列2 × 64 ／ 行1 × 64</text><rect x="60" y="490" width="640" height="95" rx="14" fill="#e4effa"/><text x="90" y="528" class="label">行1・列2のマスの左上</text><text x="90" y="564" class="title">(160, 144)</text><text x="60" y="634" class="label">x：32 + 128 = 160　 y：80 + 64 = 144</text><text x="60" y="677" class="small">1マスは64×64。行・列の番号は0から数えます。</text></svg>