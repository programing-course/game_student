<svg xmlns="http://www.w3.org/2000/svg" width="800" height="565" viewBox="0 0 800 565"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">追従するのは、プレイヤーの「足元」</text><rect x="70" y="100" width="640" height="300" fill="#e4effa" /><path d="M70 340 H710" stroke="#26835c" stroke-width="2" stroke-dasharray="8 6"/><rect x="250" y="280" width="45" height="60" fill="#db633b" /><text x="330" y="334" font-size="20">足元を画面の高さ80%付近へ</text><text x="330" y="190" font-size="22">上を見る余裕を残す</text><text x="45" y="445" font-size="22">例：画面の高さ600、anchor.y = 0.8</text><text x="45" y="488" font-size="24">足元の画面位置 = 600 × 0.8 = 480</text><text x="45" y="529" font-size="18">足元が100上がる → カメラのyも100小さくする。</text></g></svg>