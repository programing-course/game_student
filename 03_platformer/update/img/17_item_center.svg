<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" fill="white"/><g font-family="sans-serif" fill="#17324d"><text x="30" y="38" font-size="28">左上ではなく「マスの中心」に置く</text><rect x="80" y="95" width="256" height="256" rx="5" fill="#eff6ff" stroke="#64748b"/><circle cx="208" cy="223" r="60" fill="#fbbf24"/><circle cx="208" cy="223" r="5" fill="#17324d"/><text x="85" y="85" font-size="20">1マス＝64</text><text x="90" y="385" font-size="20">アイテムは30 × 30</text><text x="385" y="112" font-size="22">例：行15・列1（番号は0から）</text><text x="385" y="165" font-size="22">マスの左端：1 × 64 ＝ 64</text><text x="385" y="212" font-size="22">中心のx：64 ＋ 32 ＝ 96</text><text x="385" y="270" font-size="22">中心のy：マップ上端 ＋ 992</text><text x="385" y="315" font-size="22">（15 × 64 ＋ 32 ＝ 992）</text><text x="385" y="385" font-size="22">Anchor.center に渡す座標</text></g></svg>