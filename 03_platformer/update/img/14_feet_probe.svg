<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">足元に「細いセンサー」を作って床を探す</text><rect x="40" y="275" width="330" height="65" fill="#6288a8" /><rect x="70" y="110" width="230" height="165" fill="#b7e8cc" /><rect x="80" y="275" width="210" height="16" fill="#f0ae4d" /><text x="405" y="150" font-size="21">緑：プレイヤー本体</text><text x="405" y="194" font-size="21">黄：足元を調べる四角形</text><text x="405" y="238" font-size="21">青：ブロック</text><path d="M290 281 L390 281" fill="none" stroke="#2384b5" stroke-width="2" /><text x="405" y="288" font-size="18">高さ0.5（見やすく拡大）</text><text x="40" y="390" font-size="21">本体が床にぴったり触れるだけ → 重なりなし</text><text x="40" y="433" font-size="21">足元の黄色い四角が床に少し入る → 重なりあり</text><text x="40" y="480" font-size="18">左右は0.01ずつ内側にして、横の壁を拾いにくくする。</text><text x="40" y="523" font-size="18">どれか1つの床と重なれば any() がtrue → 接地。</text><text x="40" y="563" font-size="18">ジャンプで上昇中は、この確認で接地に戻さない。</text></g></svg>