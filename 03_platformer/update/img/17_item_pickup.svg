<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" fill="white"/><g font-family="sans-serif" fill="#17324d"><text x="30" y="38" font-size="28">取ったときの効果は、既存の処理を使う</text><rect x="30" y="95" width="265" height="260" rx="5" fill="#eff6ff" stroke="#64748b"/><text x="45" y="140" font-size="25">coin</text><text x="45" y="205" font-size="18">COIN が1増える</text><text x="45" y="270" font-size="18">コインだけ数に加算</text><rect x="320" y="95" width="265" height="260" rx="5" fill="#eff6ff" stroke="#64748b"/><text x="335" y="140" font-size="25">jumpUp</text><text x="335" y="205" font-size="18">powerCount が1増える</text><text x="335" y="270" font-size="18">Qキーで強化を発動</text><rect x="610" y="95" width="265" height="260" rx="5" fill="#eff6ff" stroke="#64748b"/><text x="625" y="140" font-size="25">shotUp</text><text x="625" y="205" font-size="18">強化時間をセット</text><text x="625" y="270" font-size="18">Eキーで強化弾を撃つ</text><text x="35" y="415" font-size="22">接触 → 種類を調べる → 効果を反映 → アイテムを消す</text></g></svg>