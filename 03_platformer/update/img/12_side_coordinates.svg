<svg xmlns="http://www.w3.org/2000/svg" width="800" height="475" viewBox="0 0 800 475"><rect width="100%" height="100%" fill="white"/><g font-family="Hiragino Sans, sans-serif" fill="#16324f"><text x="35" y="48" font-size="27">行・列を、ブロックの左上の座標に変える</text><text x="40" y="106" font-size="20">1マス64 × 64、マップの左上を (0, 0) とした場合</text><rect x="40" y="150" width="720" height="85" rx="12" fill="#e4effa"/><text x="60" y="185" font-size="20">列4 → x = 4 × 64</text><text x="530" y="208" font-size="20">x = 256</text><rect x="40" y="255" width="720" height="85" rx="12" fill="#e4effa"/><text x="60" y="290" font-size="20">行2 → y = 2 × 64</text><text x="530" y="313" font-size="20">y = 128</text><text x="40" y="390" font-size="20">行2・列4のマスの左上は (256, 128)</text><text x="40" y="437" font-size="18">上の行ほどyが小さい。カメラが動いても世界の座標は同じ。</text></g></svg>