<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="27">基準位置から、画面の左右端までの距離</text><rect x="65" y="130" width="670" height="150" fill="#e4effa" /><path d="M266 100 V310" stroke="#db633b" stroke-width="3"/><text x="70" y="100" font-size="21">画面左端</text><text x="520" y="100" font-size="21">画面右端</text><text x="95" y="195" font-size="26">300</text><text x="455" y="195" font-size="26">700</text><text x="205" y="345" font-size="21">カメラの基準位置</text><text x="40" y="400" font-size="21">例：見える幅1000、anchor.x = 0.3</text><text x="40" y="446" font-size="19">左へ1000 × 0.3 = 300、右へ1000 × 0.7 = 700</text><text x="40" y="490" font-size="19">マップ幅1728なら、基準位置は300 ～ 1028に制限。</text><text x="40" y="531" font-size="19">最小：0 + 300　／　最大：1728 − 700 = 1028</text></g></svg>