<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460"><rect width="800" height="460" fill="white"/><style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16324f;font-size:22px}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">ダンジョンでは重力の処理へ進まない</text><rect x="180" y="85" width="440" height="64" rx="12" fill="#e4effa"/><text x="400" y="125" text-anchor="middle">currentStage == 2 ?</text><path d="M300 149 V184 H190 V212 M500 149 V184 H610 V212" fill="none" stroke="#2384b5" stroke-width="3"/><text x="180" y="201" class="small">はい</text><text x="590" y="201" class="small">いいえ</text><rect x="35" y="218" width="340" height="155" rx="12" fill="#e4f6ed"/><text x="60" y="258">速度を0にする</text><text x="60" y="301">return で処理を終える</text><text x="60" y="344" class="small">今回は開始マスにとどまる</text><rect x="425" y="218" width="340" height="155" rx="12" fill="#e4effa"/><text x="450" y="258">これまでどおり</text><text x="450" y="301">重力・地面判定・移動</text><text x="450" y="344" class="small">横スクロールのステージ</text><text x="35" y="425" class="small">アニメーションと強化の残り時間は、分岐より前に更新します。</text></svg>