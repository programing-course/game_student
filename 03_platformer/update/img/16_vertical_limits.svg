<svg xmlns="http://www.w3.org/2000/svg" width="800" height="575" viewBox="0 0 800 575"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="26">上下の制限も「画面が収まる位置」で計算する</text><rect x="70" y="100" width="210" height="250" fill="#e4effa" /><path d="M60 300 H295" stroke="#db633b" stroke-width="3"/><text x="315" y="140" font-size="21">見える高さ600、anchor.y = 0.8</text><text x="315" y="189" font-size="21">基準から上へ480、下へ120</text><text x="315" y="238" font-size="21">マップ上端 −100、下端604</text><text x="315" y="286" font-size="21">高さは704（11行 × 64）</text><text x="40" y="407" font-size="23">カメラyの最小：−100 + 480 = 380</text><text x="40" y="453" font-size="23">カメラyの最大：604 − 120 = 484</text><text x="40" y="499" font-size="18">上端・下端は世界座標。マップ上端を0と決めつけない。</text><text x="40" y="538" font-size="17">数値は説明用。実際は配列とdungeonMapTopから計算します。</text></g></svg>