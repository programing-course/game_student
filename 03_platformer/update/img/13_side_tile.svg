<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, sans-serif"><text x="35" y="48" font-size="27">元画像32×32を、64×64のブロックにする</text><rect x="40" y="100" width="220" height="150" rx="12" fill="#e4effa"/><text x="60" y="140" font-size="18">battle_tileset.png</text><text x="60" y="183" font-size="22">左上 (0, 0)</text><text x="60" y="224" font-size="18">32×32を切り取る</text><text x="290" y="185" font-size="22">→</text><rect x="350" y="100" width="400" height="150" rx="12" fill="#e4effa"/><text x="375" y="150" font-size="22">ゲーム世界では64×64</text><text x="375" y="198" font-size="18">元画像自体は変更しない</text><text x="40" y="310" font-size="22">今回は石の模様を1種類だけ使います。</text><text x="40" y="355" font-size="18">0の場所には画像を置かず、暗い背景を見せます。</text></g></svg>