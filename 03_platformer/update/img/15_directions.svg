<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">画面の座標と、上下左右の速度</text><rect x="260" y="85" width="280" height="90" rx="12" fill="#e4effa"/><text x="280" y="120" class="">↑ 上へ</text><text x="280" y="155" class="small">x = 0 / y = −200</text><rect x="25" y="210" width="280" height="90" rx="12" fill="#e4effa"/><text x="45" y="245" class="">← 左へ</text><text x="45" y="280" class="small">x = −200 / y = 0</text><rect x="495" y="210" width="280" height="90" rx="12" fill="#e4effa"/><text x="515" y="245" class="">右へ →</text><text x="515" y="280" class="small">x = 200 / y = 0</text><rect x="260" y="335" width="280" height="90" rx="12" fill="#e4effa"/><text x="280" y="370" class="">↓ 下へ</text><text x="280" y="405" class="small">x = 0 / y = 200</text><circle cx="400" cy="255" r="36" fill="#b7e8cc"/><text x="385" y="263" class="">人</text><text x="35" y="473" class="small">右・下はプラス、左・上はマイナス。</text><text x="35" y="511" class="small">moveSpeed = 200 の場合。速度の単位は1秒あたりの距離。</text></svg>