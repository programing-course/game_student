<svg xmlns="http://www.w3.org/2000/svg" width="800" height="505" viewBox="0 0 800 505"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">XとYを別々に指定すると、斜めにも動く</text><path d="M100 330 H550 V150 M100 330 L550 150" fill="none" stroke="#2384b5" stroke-width="3"/><circle cx="100" cy="330" r="7" fill="#2384b5"/><circle cx="550" cy="150" r="7" fill="#26835c"/><text x="65" y="376" class="">開始 (100, 300)</text><text x="490" y="114" class="">終了 (250, 200)</text><text x="230" y="313" class="">X：右へ150</text><text x="570" y="230" class="">Y：上へ100</text><text x="570" y="268" class="">指定は −100</text><text x="35" y="430" class="">終了位置 = 開始位置 + (150, −100)</text><text x="35" y="474" class="small">右・下はプラス、左・上はマイナス。</text></svg>