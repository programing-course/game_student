<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">扉の位置は「下辺の中央」で決まる</text><rect x="110" y="120" width="160" height="200" rx="12" fill="#c7dff3"/><rect x="130" y="140" width="120" height="180" fill="#6288a8"/><circle cx="230" cy="240" r="7" fill="#f5d176"/><path d="M40 320 H750" stroke="#26835c" stroke-width="4"/><circle cx="190" cy="320" r="8" fill="#de6741"/><text x="135" y="100" class="">幅80</text><text x="290" y="220" class="">高さ100</text><text x="380" y="150" class="">Anchor.bottomCenter</text><text x="380" y="195" class="">赤い点が position</text><text x="380" y="240" class="">(pos_x, pos_y)</text><text x="350" y="357" class="">地面：Y_GROUND_POSITION</text><text x="40" y="410" class="small">pos_y を地面の高さにすると、扉の下辺が地面にそろう。</text><text x="40" y="451" class="small">pos_x = screenSize.x × 4 − 150</text><text x="40" y="488" class="small">横位置は画面幅を使って計算し、ステージの後半へ置く。</text></svg>