<svg xmlns="http://www.w3.org/2000/svg" width="800" height="630" viewBox="0 0 800 630"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}.white{fill:white}</style><text x="35" y="48" class="title">扉からダンジョンの準備へ</text><rect x="60" y="85" width="680" height="64" rx="8" fill="#e4effa"/><text x="85" y="125" class="">扉に触れる</text><text x="385" y="174" class="">↓</text><rect x="60" y="180" width="680" height="64" rx="8" fill="#e4effa"/><text x="85" y="220" class="">enterDungeon()</text><text x="385" y="269" class="">↓</text><rect x="60" y="275" width="680" height="64" rx="8" fill="#e4effa"/><text x="85" y="315" class="">currentStage = 2</text><text x="385" y="364" class="">↓</text><rect x="60" y="370" width="680" height="64" rx="8" fill="#e4effa"/><text x="85" y="410" class="">objectRemove(keepPlayer: true)</text><text x="385" y="459" class="">↓</text><rect x="60" y="465" width="680" height="64" rx="8" fill="#e4f6ed"/><text x="85" y="505" class="">case 2 でマップのデータを使う</text><text x="40" y="600" class="small">同じゲームの中で、ステージを切り替えます。</text></svg>