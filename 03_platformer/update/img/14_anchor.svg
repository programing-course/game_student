<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><rect width="800" height="480" fill="white"/><style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#16324f;font-size:22px}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">プレイヤーの「中央」をマスの中央に重ねる</text><rect x="70" y="110" width="256" height="256" fill="#e4f6ed" stroke="#26835c" stroke-width="3"/><rect x="78" y="118" width="240" height="240" rx="12" fill="#c9def5" stroke="#2384b5" stroke-width="2"/><path d="M70 238 H326 M198 110 V366" stroke="#2384b5" stroke-dasharray="7 5"/><circle cx="198" cy="238" r="7" fill="#de6741"/><text x="360" y="155">マス：64×64</text><text x="360" y="198">プレイヤー：60×60</text><text x="360" y="241">周囲の余白：(64 − 60) ÷ 2</text><text x="360" y="284" class="title">上下左右に2ずつ</text><text x="360" y="335" class="small">青い四角はプレイヤーの表示範囲です。</text><text x="40" y="418">Anchor.center → position は中央の位置</text><text x="40" y="457" class="small">マスの左上をそのまま渡さず、中央 (128, 176) を渡します。</text></svg>