<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}</style><text x="35" y="48" class="title">ステージを作り直しても、同じプレイヤーを使う</text><rect x="40" y="90" width="720" height="65" rx="12" fill="#e4effa"/><text x="65" y="131" class="">objectRemove(keepPlayer: true)</text><rect x="40" y="190" width="345" height="195" rx="12" fill="#e4f6ed"/><text x="65" y="229" class="">プレイヤー</text><text x="65" y="273" class="">削除せずに残す</text><text x="65" y="316" class="">新しく作り直さない</text><text x="65" y="360" class="small">所持アイテムも引き継ぐ</text><rect x="415" y="190" width="345" height="195" rx="12" fill="#e4effa"/><text x="440" y="229" class="">背景・扉・敵など</text><text x="440" y="273" class="">前の部品を取り除く</text><text x="440" y="316" class="">次のステージ用に準備</text><text x="440" y="360" class="small">背景や配置を切り替える</text><text x="40" y="435" class="small">continue：このプレイヤーの削除を飛ばし、次の部品へ。</text><text x="40" y="478" class="small">引数を省略すると keepPlayer は false。</text><text x="40" y="514" class="small">その場合はプレイヤーも新しく作り直します。</text></svg>