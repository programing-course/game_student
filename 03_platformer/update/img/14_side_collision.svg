<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, sans-serif"><text x="35" y="48" font-size="27">ぶつかった方向に合わせて、端をそろえる</text><text x="35" y="100" font-size="20">横から</text><text x="290" y="100" font-size="20">上から着地</text><text x="545" y="100" font-size="20">下から頭をぶつける</text><rect x="55" y="195" width="75" height="90" rx="6" fill="#b7e8cc"/><rect x="130" y="195" width="85" height="90" rx="6" fill="#6288a8"/><text x="45" y="330" font-size="18">右端＝壁の左端</text><rect x="335" y="135" width="75" height="90" rx="6" fill="#b7e8cc"/><rect x="310" y="225" width="125" height="60" rx="6" fill="#6288a8"/><text x="300" y="330" font-size="18">足元＝上面</text><text x="300" y="366" font-size="18">isOnGround = true</text><rect x="560" y="135" width="150" height="60" rx="6" fill="#6288a8"/><rect x="595" y="195" width="75" height="90" rx="6" fill="#b7e8cc"/><text x="555" y="330" font-size="18">頭＝下面</text><text x="555" y="366" font-size="18">上昇速度を0へ</text><text x="35" y="425" font-size="22">横を動かして判定 → 縦を動かして判定</text><text x="35" y="468" font-size="18">一度に両方動かさず、どちらから当たったかを分けます。</text></g></svg>