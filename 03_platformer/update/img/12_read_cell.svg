<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590"><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;fill:#16324f}.title{font-size:28px;font-weight:700}.small{font-size:18px}.white{fill:white}</style><text x="35" y="48" class="title">dungeonMap[1][5] は「行 → 列」の順</text><rect x="40" y="85" width="720" height="80" rx="8" fill="#e4effa"/><text x="60" y="119" class="">① dungeonMap[1]：行1を取り出す</text><text x="60" y="148" class="small">上から2番目の横1行を選ぶ。</text><text x="90" y="209" class="small">0</text><rect x="65" y="225" width="82" height="64" rx="8" fill="#e4effa"/><text x="97" y="266" class="">1</text><text x="186" y="209" class="small">1</text><rect x="161" y="225" width="82" height="64" rx="8" fill="#e4effa"/><text x="193" y="266" class="">0</text><text x="282" y="209" class="small">2</text><rect x="257" y="225" width="82" height="64" rx="8" fill="#e4effa"/><text x="289" y="266" class="">0</text><text x="378" y="209" class="small">3</text><rect x="353" y="225" width="82" height="64" rx="8" fill="#e4effa"/><text x="385" y="266" class="">0</text><text x="474" y="209" class="small">4</text><rect x="449" y="225" width="82" height="64" rx="8" fill="#e4effa"/><text x="481" y="266" class="">1</text><text x="570" y="209" class="small">5</text><rect x="545" y="225" width="82" height="64" rx="8" fill="#7de0a5"/><text x="577" y="266" class="">2</text><text x="666" y="209" class="small">6</text><rect x="641" y="225" width="82" height="64" rx="8" fill="#e4effa"/><text x="673" y="266" class="">1</text><text x="40" y="332" class="">② [5]：その行の列5を選ぶ</text><text x="40" y="369" class="">左から6番目の値は「2」 → 出口です。</text><rect x="40" y="405" width="720" height="113" rx="8" fill="#e4f6ed"/><text x="60" y="443" class="">行の数は6、使える行番号は0〜5。</text><text x="60" y="482" class="">列の数は7、使える列番号は0〜6。</text><text x="40" y="562" class="small">「個数」と「最後の番号」は1つ違うので注意しましょう。</text></svg>