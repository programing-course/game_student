<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="26">文字は、カメラの左上から同じ距離に置く</text><rect x="50" y="150" width="300" height="230" fill="#e4effa" /><text x="66" y="188" font-size="19">STAGE3</text><text x="66" y="228" font-size="18">PLAY 10  COIN 0</text><rect x="150" y="295" width="80" height="20" fill="#6288a8" /><rect x="440" y="90" width="300" height="230" fill="#e4effa" /><text x="456" y="128" font-size="19">STAGE3</text><text x="456" y="168" font-size="18">PLAY 10  COIN 0</text><rect x="540" y="235" width="80" height="20" fill="#6288a8" /><text x="365" y="250" font-size="30">→</text><text x="40" y="430" font-size="19">画面上端の世界y = カメラy − 見える高さ × anchor.y</text><text x="40" y="474" font-size="21">文字の世界y = 画面上端の世界y + 余白</text><text x="40" y="518" font-size="18">カメラが上へ動いた分だけ、文字も上へ動かします。</text></g></svg>