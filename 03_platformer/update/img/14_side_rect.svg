<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, sans-serif"><text x="35" y="48" font-size="27">中心座標から、プレイヤーの四角形を求める</text><rect x="250" y="130" width="240" height="240" rx="6" fill="#b7e8cc"/><circle cx="370" cy="250" r="7" fill="#de6741"/><text x="390" y="255" font-size="18">中心 (x, y)</text><text x="245" y="108" font-size="22">上端：y − 高さ÷2</text><text x="245" y="407" font-size="22">下端：y + 高さ÷2</text><text x="35" y="295" font-size="18">左端</text><text x="35" y="329" font-size="18">x − 幅÷2</text><text x="555" y="295" font-size="18">右端</text><text x="555" y="329" font-size="18">x + 幅÷2</text><text x="35" y="465" font-size="18">Anchor.center なので、position は左上ではありません。</text></g></svg>