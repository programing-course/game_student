<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="100%" height="100%" fill="white"/><g fill="#16324f" font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="30" y="42" font-size="26">小さいマップでは固定する。ただし余白は残る</text><rect x="45" y="100" width="710" height="230" fill="#e4effa" /><rect x="45" y="100" width="450" height="165" fill="#b7e8cc" /><text x="95" y="165" font-size="21">マップ</text><text x="530" y="210" font-size="21">余白</text><text x="95" y="306" font-size="21">余白</text><text x="40" y="390" font-size="21">横が小さい → 左端をそろえて固定</text><text x="40" y="434" font-size="21">縦が小さい → 上端をそろえて固定</text><text x="40" y="480" font-size="19">余白をなくすには、見える範囲以上のマップが必要。</text><text x="40" y="522" font-size="17">0の空間はマップ内でも暗い背景。黒色だけでは範囲外と限りません。</text></g></svg>